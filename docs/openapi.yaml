  /support/tickets:
    post:
      tags: [support]
      summary: Create a support ticket (any authenticated user)
      description: >
        restaurantId is server-derived from the caller's own tenant when they're
        restaurant-scoped staff; a customer-submitted restaurantId is only considered when the
        caller has none of their own, and even then is validated to reference a real restaurant
        rather than trusted outright.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                subject: { type: string }
                description: { type: string }
                category:
                  type: string
                  enum: [menu, orders, billing, account, technical, data_recovery, other]
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                restaurantId: { type: string }
                context:
                  type: object
                  properties:
                    app: { type: string, enum: [web, admin] }
                    route: { type: string }
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
  /support/tickets/mine:
    get:
      tags: [support]
      summary: List the authenticated user's own tickets
      responses:
        "200":
          description: Tickets
  /support/tickets/{id}:
    get:
      tags: [support]
      summary: Get a single ticket (owner, or staff of that ticket's restaurant, or platform support)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ticket
        "403":
          $ref: "#/components/responses/Forbidden"
  /support/tickets/{id}/messages:
    get:
      tags: [support]
      summary: List a ticket's conversation
      description: >
        Internal notes (isInternal: true) are excluded by the database query itself for any
        caller without support.tickets.internal_notes — never filtered client-side.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messages
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [support]
      summary: Reply to a ticket (owner, or authorized staff)
      description: >
        isInternal is only ever honored if the requester has support.tickets.internal_notes —
        otherwise rejected outright, never silently downgraded to a visible reply. A customer's
        own non-internal reply to a resolved/waiting_customer ticket automatically reopens it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                isInternal: { type: boolean }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportMessage" }
        "400":
          description: Ticket is closed
        "403":
          $ref: "#/components/responses/Forbidden"
  /support/tickets/{id}/confirm-resolution:
    patch:
      tags: [support]
      summary: Customer confirms a resolved ticket is fixed, closing it (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ticket closed
        "400":
          description: Ticket is not currently "resolved"
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/support/tickets:
    get:
      tags: [support]
      summary: List this restaurant's own tickets, read-only (requires support.tickets.read on this tenant)
      description: Owner/manager only — never includes internal notes (see /support/tickets/{id}/messages).
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Tickets
        "403":
          $ref: "#/components/responses/Forbidden"
  /support/admin/tickets:
    get:
      tags: [support]
      summary: Platform-wide ticket list (platform_admin only)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: assignedTo
          in: query
          schema: { type: string }
        - name: restaurantId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Tickets (up to 200, newest first)
        "403":
          $ref: "#/components/responses/Forbidden"
  /support/admin/tickets/{id}/status:
    patch:
      tags: [support]
      summary: Change a ticket's status through the validated transition table (platform_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, in_progress, waiting_customer, resolved, closed] }
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid transition
  /support/admin/tickets/{id}/priority:
    patch:
      tags: [support]
      summary: Change a ticket's priority (platform_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: string, enum: [low, normal, high, urgent] }
      responses:
        "200":
          description: Updated
  /support/admin/tickets/{id}/assign:
    patch:
      tags: [support]
      summary: Assign (or unassign) a ticket to a platform_admin user (requires support.tickets.assign)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedTo]
              properties:
                assignedTo:
                  type: string
                  nullable: true
                  description: Must reference an existing platform_admin user, or null to unassign.
      responses:
        "200":
          description: Updated
        "400":
          description: assignedTo does not reference a platform_admin user
  /support/admin/analytics:
    get:
      tags: [support]
      summary: Basic support queue metrics — open/in_progress/waiting/resolved/highPriority counts (requires support.analytics.read)
      responses:
        "200":
          description: Analytics
