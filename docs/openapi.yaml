        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [knowledge-base]
      summary: Create an article (requires support.knowledgebase.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseArticle" }
      responses:
