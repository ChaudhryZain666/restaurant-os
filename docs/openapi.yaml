openapi: 3.0.3
info:
  title: Restaurant Platform API
  version: "1"
  description: >
    Multi-tenant restaurant ordering + CRM platform API. All routes are
    versioned under /api/v1. Every response uses the envelope described in
    ApiSuccess / ApiErrorBody below.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        requestId:
          type: string
    ApiErrorBody:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details: {}
        requestId:
          type: string
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [platform_admin, restaurant_owner, restaurant_manager, restaurant_staff, kitchen_staff, customer]
        restaurantId: { type: string, nullable: true }
    Restaurant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string }
        status: { type: string, enum: [pending, active, suspended] }
    Category:
      type: object
      properties:
        id: { type: string }
        restaurantId: { type: string }
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    MenuItem:
      type: object
      properties:
        id: { type: string }
        restaurantId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        isAvailable: { type: boolean }
        sortOrder: { type: integer }
    ModifierOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        priceAdjustment: { type: number }
        isActive: { type: boolean }
        sortOrder: { type: integer }
    ModifierGroup:
      type: object
      properties:
        id: { type: string }
        restaurantId: { type: string }
        menuItemId: { type: string }
        name: { type: string }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/ModifierOption" }
    Order:
      type: object
      properties:
        id: { type: string }
        restaurantId: { type: string }
        customerId: { type: string }
        orderNumber: { type: string, example: "ORD-1001" }
        orderType:
          type: string
          enum: [pickup, delivery]
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, out_for_delivery, completed, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, paid]
        subtotal: { type: number }
        taxAmount: { type: number }
        deliveryFee: { type: number }
        discount: { type: number }
        total: { type: number }
        loyaltyPointsEarned: { type: number }
        loyaltyPointsRedeemed: { type: number }
        deliveryAddress: { type: string }
        customerNotes: { type: string }
        customerName:
          type: string
          description: Present only on staff-facing responses (restaurant order list/detail).
        customerPhone:
          type: string
          description: Present only on staff-facing responses (restaurant order list/detail).
        statusHistory:
          type: array
          description: Every status this order has passed through, in order — powers the customer tracking timeline.
          items:
            type: object
            properties:
              status:
                type: string
                enum: [pending, confirmed, preparing, ready, out_for_delivery, completed, cancelled]
              at: { type: string, format: date-time }
    ReorderPreview:
      type: object
      description: >
        A re-priced, re-validated preview of a past order's contents against CURRENT menu data —
        not an order. The frontend uses this to populate a fresh cart.
      properties:
        restaurantId: { type: string }
        restaurantAvailable: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              menuItemId: { type: string }
              name: { type: string }
              unitPrice: { type: number }
              quantity: { type: integer }
              lineTotal: { type: number }
        unavailableItems:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
        subtotal: { type: number }
    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        isDefault: { type: boolean }
    RestaurantAnalytics:
      type: object
      description: >
        "Revenue" is the sum of `total` for orders that are both non-cancelled AND marked paid —
        this platform has no real payment processor, only staff-toggled paymentStatus. "Today"
        and "this week" are UTC calendar-day / rolling-7-day windows.
      properties:
        ordersToday: { type: integer }
        ordersThisWeek: { type: integer }
        revenueToday: { type: number }
        revenueThisWeek: { type: number }
        averageOrderValue: { type: number }
        completedOrdersThisWeek: { type: integer }
        cancelledOrdersThisWeek: { type: integer }
        topSellingItems:
          type: array
          items:
            type: object
            properties:
              menuItemId: { type: string }
              name: { type: string }
              quantitySold: { type: integer }
    RestaurantAvailability:
      type: object
      description: >
        Computed from settings.orderingEnabled / settings.temporarilyPaused. Does not factor in
        businessHours — that stays informational/display-only in Phase 2.
      properties:
        status:
          type: string
          enum: [open, closed, paused]
        reason:
          type: string
          description: Present when status is "paused" and the restaurant supplied a reason.
    SupportIdentity:
      type: object
      description: >
        The support identity a customer-facing UI should display. Always { name: "Platform
        Support", isWhiteLabel: false } today — no white-label/agency configuration exists
        anywhere in this codebase yet. See docs/support-architecture.md.
      properties:
        name: { type: string }
        isWhiteLabel: { type: boolean }
    KnowledgeBaseCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    KnowledgeBaseArticle:
      type: object
      properties:
        id: { type: string }
        categoryId: { type: string }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        content:
          type: string
          description: Omitted from list responses (select("-content")) — only present on the single-article detail response.
        status: { type: string, enum: [draft, published] }
        sortOrder: { type: integer }
        authorId: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SupportTicket:
      type: object
      properties:
        id: { type: string }
        ticketNumber: { type: string, example: "TKT-1001" }
        subject: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [open, in_progress, waiting_customer, resolved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        category:
          type: string
          enum: [menu, orders, billing, account, technical, data_recovery, other]
        source:
          type: string
          enum: [help_widget, support_center, admin, system]
        createdBy: { type: string }
        restaurantId:
          type: string
          nullable: true
          description: Absent for tickets with no restaurant context (e.g. a general account question).
        agencyId:
          type: string
          nullable: true
          description: >
            Reserved for a future Agency model — always absent today. No Agency collection
            exists anywhere in this codebase. See docs/support-architecture.md.
        assignedTo:
          type: string
          nullable: true
          description: Must reference a platform_admin user; set only via PATCH /support/admin/tickets/{id}/assign.
        context:
          type: object
          properties:
            app: { type: string, enum: [web, admin] }
            route: { type: string }
            userAgent: { type: string }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [open, in_progress, waiting_customer, resolved, closed] }
              at: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdByName:
          type: string
          description: Present only on staff-facing responses.
        createdByEmail:
          type: string
          description: Present only on staff-facing responses.
        restaurantName:
          type: string
          description: Present only on staff-facing responses.
        assignedToName:
          type: string
          description: Present only on staff-facing responses.
    SupportMessage:
      type: object
      properties:
        id: { type: string }
        ticketId: { type: string }
        authorId: { type: string }
        authorType: { type: string, enum: [customer, support] }
        content: { type: string }
        isInternal:
          type: boolean
          description: >
            Never present in a response returned to a caller without support.tickets.internal_notes —
            filtered at the database query level, not just omitted from a schema.
        createdAt: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
    Forbidden:
      description: Authenticated but not permitted (wrong role, or wrong tenant)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                phone: { type: string }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Exchange the httpOnly refresh cookie for a new access token
      responses:
        "200":
          description: New access token issued
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
    patch:
      tags: [auth]
      summary: Update the authenticated user's own profile (name/phone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Updated profile
    delete:
      tags: [auth]
      summary: Delete (customer) or anonymize the authenticated user's own account
      description: >
        Customer accounts are anonymized (name/email/phone cleared, refresh tokens revoked)
        rather than removed, so existing Order.customerId / AuditLog.actorUserId references
        stay valid. Restaurant staff/owner accounts cannot self-delete here — they must contact
        platform support to transfer ownership or remove staff access first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Account anonymized
        "400":
          description: Restaurant staff/owner attempting self-deletion, or wrong password
  /auth/change-password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password changed
  /auth/request-password-reset:
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: >
            Always 200 regardless of whether the email exists, to avoid leaking account
            existence.
  /auth/reset-password:
    post:
      tags: [auth]
      security: []
      summary: Reset a password using the token emailed by request-password-reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password reset
        "400":
          description: Invalid or expired token
  /auth/request-email-change:
    post:
      tags: [auth]
      summary: Request an email-change confirmation link, sent to the new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, password]
              properties:
                newEmail: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Confirmation email sent
  /auth/confirm-email-change:
    post:
      tags: [auth]
      security: []
      summary: Confirm an email change using the token emailed by request-email-change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email changed
        "400":
          description: Invalid or expired token
  /auth/accept-invite:
    post:
      tags: [auth]
      security: []
      summary: Accept a staff invite and set a password, activating the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Invite accepted, logged in
        "400":
          description: Invalid or expired invite token
  /users/me/addresses:
    get:
      tags: [account]
      summary: List the authenticated user's saved delivery addresses
      responses:
        "200":
          description: Addresses
    post:
      tags: [account]
      summary: Add a saved delivery address for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Address" }
      responses:
        "201":
          description: Address added
  /users/me/addresses/{addressId}:
    patch:
      tags: [account]
      summary: Update one of the authenticated user's own saved addresses
      description: >
        Identity-scoped, not tenant-scoped — operates exclusively on the caller's own User
        document; there is no code path to target another user's address.
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: Updated addresses
        "404":
          description: Address not found
    delete:
      tags: [account]
      summary: Remove one of the authenticated user's own saved addresses
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Remaining addresses
        "404":
          description: Address not found
  /restaurants:
    post:
      tags: [restaurants]
      summary: Create a restaurant and assign an owner (platform_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, ownerId]
              properties:
                name: { type: string }
                slug: { type: string }
                ownerId: { type: string }
      responses:
        "201":
          description: Restaurant created
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/me:
    get:
      tags: [restaurants]
      summary: Get the authenticated user's own restaurant
      description: >
        Response data includes `restaurant`, a computed `availability` (RestaurantAvailability),
        and a computed `supportIdentity` (SupportIdentity).
      responses:
        "200":
          description: Restaurant
  /restaurants/by-slug/{slug}:
    get:
      tags: [restaurants]
      security: []
      summary: Look up an active restaurant by its public slug
      description: >
        Response data includes `restaurant`, a computed `availability` (RestaurantAvailability),
        and a computed `supportIdentity` (SupportIdentity).
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restaurant
        "404":
          description: Not found
  /restaurants/{restaurantId}/menu:
    get:
      tags: [menu]
      security: []
      summary: List a restaurant's available menu items (Redis-cached, 60s TTL)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Menu items
    post:
      tags: [menu]
      summary: Create a menu item (requires restaurant.menu.write on this tenant)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItem" }
      responses:
        "201":
          description: Menu item created
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/menu/items:
    get:
      tags: [menu]
      summary: List ALL menu items including unavailable ones (staff, requires restaurant.menu.read)
      description: >
        Uncached and staff-only, unlike GET /menu — that endpoint is public and Redis-cached, so
        it must never include hidden items. Staff need to see hidden items to be able to
        un-hide them, hence this separate endpoint.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Menu items, including unavailable ones (isAvailable: false)"
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/menu/{id}:
    patch:
      tags: [menu]
      summary: Update a menu item
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [menu]
      summary: Delete a menu item
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /restaurants/{restaurantId}/customers:
    get:
      tags: [customers]
      summary: List this restaurant's customers with lifetime order stats (requires restaurant.orders.read)
      description: >
        Server-side paginated aggregation over Order, grouped by customer — never fetches a
        restaurant's full order history to compute this.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Case-insensitive match against customer name or email
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [lastOrderAt, totalSpent, totalOrders, name], default: lastOrderAt }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Paginated customer summaries
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/customers/{customerId}/orders:
    get:
      tags: [customers]
      summary: A single customer's order history at this restaurant (requires restaurant.orders.read)
      description: >
        The drill-down behind a Customers row — separately paginated from the aggregation above,
        bounded the same way GET /orders/mine is for a customer's own history.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: customerId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated orders for this customer at this restaurant
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/orders:
    post:
      tags: [orders]
      summary: Place an order at this restaurant (any authenticated customer)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menuItemId: { type: string }
                      quantity: { type: integer, minimum: 1 }
                redeemPoints: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Order created (order + loyalty ledger written in one Mongo transaction)
    get:
      tags: [orders]
      summary: List all orders for this restaurant (staff, requires restaurant.orders.read)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Orders
  /restaurants/{restaurantId}/orders/{id}/status:
    patch:
      tags: [orders]
      summary: Update an order's status (staff, requires restaurant.orders.manage)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, preparing, ready, out_for_delivery, completed, cancelled]
      responses:
        "200":
          description: Updated
  /restaurants/{restaurantId}/orders/{id}/payment-status:
    patch:
      tags: [orders]
      summary: Mark an order paid/unpaid (staff, requires restaurant.orders.manage)
      description: >
        Manual payment tracking only — no payment processing is implemented. Useful for cash/
        in-person orders where the restaurant wants a record of settlement.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentStatus]
              properties:
                paymentStatus: { type: string, enum: [unpaid, paid] }
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
  /orders/mine:
    get:
      tags: [orders]
      summary: List the authenticated customer's own orders, across all restaurants
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated orders
  /orders/{id}:
    get:
      tags: [orders]
      summary: Get a single order (owner, or staff of that order's restaurant)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
  /orders/{id}/cancel:
    patch:
      tags: [orders]
      summary: Cancel the authenticated customer's own order
      description: >
        Only allowed while the order is still "pending" — once a restaurant has accepted it,
        only restaurant staff can cancel it (via the restaurant-scoped status endpoint).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order cancelled
        "400":
          description: Order is no longer cancellable (already accepted, completed, or cancelled)
        "403":
          $ref: "#/components/responses/Forbidden"
  /orders/{id}/reorder:
    post:
      tags: [orders]
      summary: Preview reordering a past order against CURRENT menu data and pricing
      description: >
        Does NOT create an order — returns a ReorderPreview the frontend uses to populate a
        fresh cart. Historical prices are never trusted; every item is re-validated and
        re-priced against the live menu, and items that no longer exist or are no longer valid
        are reported in `unavailableItems` instead of silently dropped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reorder preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderPreview" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/analytics:
    get:
      tags: [analytics]
      summary: Basic restaurant analytics (staff, requires restaurant.analytics.read)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantAnalytics" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/loyalty/me:
    get:
      tags: [loyalty]
      summary: Get the authenticated customer's loyalty account at this restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
