          description: Deleted
  /kb/categories:
    get:
      tags: [knowledge-base]
      security: []
      summary: List active knowledge-base categories (public)
      responses:
        "200":
          description: Categories
  /kb/articles:
    get:
      tags: [knowledge-base]
      security: []
      summary: List published articles (public), optionally filtered by ?category=slug and/or full-text ?q=
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Articles (content field omitted)
  /kb/articles/{slug}:
    get:
      tags: [knowledge-base]
      security: []
      summary: Get a single published article by slug, with up to 4 related articles (public)
      description: >
        Returns 404 identically whether the slug doesn't exist at all or exists but is
        unpublished — a draft's existence is never discoverable from this endpoint.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Article + related
        "404":
          description: Not found
  /kb/admin/categories:
    get:
      tags: [knowledge-base]
      summary: List all knowledge-base categories, including inactive (requires support.knowledgebase.write)
      responses:
        "200":
          description: Categories
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [knowledge-base]
      summary: Create a knowledge-base category (requires support.knowledgebase.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseCategory" }
      responses:
        "201":
          description: Category created
        "403":
          $ref: "#/components/responses/Forbidden"
  /kb/admin/categories/{id}:
    patch:
      tags: [knowledge-base]
      summary: Update a knowledge-base category (requires support.knowledgebase.write)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [knowledge-base]
      summary: Delete a category (requires support.knowledgebase.write; blocked while it still has articles)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "409":
          description: Category still has articles
  /kb/admin/articles:
    get:
      tags: [knowledge-base]
      summary: List ALL articles including drafts (requires support.knowledgebase.write)
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
