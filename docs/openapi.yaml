      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Loyalty transactions
  /restaurants/{restaurantId}:
    patch:
      tags: [restaurants]
      summary: Update restaurant profile and settings (requires restaurant.settings.manage — owner only)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated restaurant
        "403":
          $ref: "#/components/responses/Forbidden"
  /restaurants/{restaurantId}/categories:
    get:
      tags: [categories]
      summary: List all categories for this restaurant (staff, requires restaurant.menu.read via tenant auth)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Categories
    post:
      tags: [categories]
      summary: Create a category (requires restaurant.categories.write)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Category created
  /restaurants/{restaurantId}/categories/{id}:
    patch:
      tags: [categories]
      summary: Update a category (requires restaurant.categories.write)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [categories]
      summary: Delete a category (requires restaurant.categories.write; blocked while it still has menu items)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "409":
          description: Category still has menu items
  /restaurants/{restaurantId}/menu/{menuItemId}/modifiers:
    get:
      tags: [modifiers]
      summary: List modifier groups for a menu item
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: menuItemId
