      responses:
        "200":
          description: Article
    patch:
      tags: [knowledge-base]
      summary: Update an article, including publish/unpublish via the status field (requires support.knowledgebase.write)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
