        - name: menuItemId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [modifiers]
      summary: Delete a modifier group (requires restaurant.modifiers.write)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string }
        - name: menuItemId
          in: path
          required: true
