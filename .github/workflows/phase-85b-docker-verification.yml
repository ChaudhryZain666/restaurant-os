# TEMPORARY — Phase 85B Docker verification. Builds and runs the real production images on a
# GitHub-hosted Linux runner (the local Windows machine cannot run Docker). To be deleted once the
# results are recorded in PHASE_85B_PRODUCTION_CONTAINER_INFRASTRUCTURE_VERIFICATION_REPORT.md.
#
# Uses only throwaway, generated test values. Pushes no images, uses no repository secrets, and
# connects to nothing outside the runner (base images and npm packages excepted).
name: Phase 85B Docker verification (temporary)

on:
  workflow_dispatch:
  push:
    branches: [phase-85b-docker-verification]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RESULTS: ${{ github.workspace }}/../results.txt
    steps:
      - uses: actions/checkout@v4

      - name: Helpers and environment inventory
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          set +e  # every check records its own result; build failures exit explicitly
          RESULTS="$GITHUB_WORKSPACE/../results.txt"
          # Annotations are capped at 50 per job, so only failures get their own annotation; the
          # Summary step publishes every result as one combined notice.
          pass() { echo "PASS | $1 | $2" >> "$RESULTS"; echo "PASS: $1 | $2"; }
          fail() { echo "FAIL | $1 | $2" >> "$RESULTS"; echo "::error title=FAIL: $1::$2"; }
          info() { echo "INFO | $1 | $2" >> "$RESULTS"; echo "INFO: $1 | $2"; }
          check() { local name="$1" detail="$2"; shift 2; if "$@"; then pass "$name" "$detail"; else fail "$name" "$detail"; fi; }
          EOF
          source "$RUNNER_TEMP/lib.sh"
          info "Runner" "$(lsb_release -ds) / kernel $(uname -r) / $(nproc) CPUs"
          info "Docker" "$(docker version --format 'client {{.Client.Version}} / server {{.Server.Version}}')"
          info "Buildx" "$(docker buildx version | head -1)"
          info "Commit" "$GITHUB_SHA"

      # The developer machine has apps/*/.env files (Phase 85B found VITE_RESTAURANT_SLUG=demo-restaurant
      # in apps/web/.env). Recreate that situation, plus unique canaries in every .env variant, so
      # the build proves none of them reach any image or bundle.
      - name: Plant decoy local .env files (simulating the developer checkout)
        run: |
          printf 'VITE_RESTAURANT_SLUG=demo-restaurant\nVITE_API_URL=http://localhost:4000\n' > apps/web/.env
          printf 'VITE_RESTAURANT_SLUG=leakcanary-slug-85b\n' > apps/web/.env.local
          printf 'VITE_RESTAURANT_SLUG=leakcanary-prodslug-85b\n' > apps/web/.env.production
          printf 'VITE_API_URL=http://localhost:4000\nVITE_POS_URL=https://leakcanary-admin-85b.example\n' > apps/admin/.env
          printf 'VITE_SITE_URL=https://leakcanary-marketing-85b.example\n' > apps/marketing/.env.local
          printf 'JWT_ACCESS_SECRET=leakcanary-jwt-85b-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\nMONGO_URI=mongodb://leakcanary-mongo-85b.example/db\nPADDLE_API_KEY=leakcanary-paddle-85b\nSMTP_PASSWORD=leakcanary-smtp-85b\n' > apps/api/.env
          cp apps/api/.env apps/api/.env.production
          printf 'JWT_REFRESH_SECRET=leakcanary-rootenv-85b\n' > .env
          ls -a apps/web apps/api | grep '^\.env' | tr '\n' ' '

      - name: Build API image (infrastructure/docker/api.prod.Dockerfile)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          start=$(date +%s)
          if docker build -f infrastructure/docker/api.prod.Dockerfile -t gt-api:85b . > "$RUNNER_TEMP/build-api.log" 2>&1; then
            pass "Build API image" "$(( $(date +%s) - start ))s, $(docker image inspect gt-api:85b --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}')"
          else
            tail -60 "$RUNNER_TEMP/build-api.log"; fail "Build API image" "see log"; exit 1
          fi
          info "API image config" "$(docker image inspect gt-api:85b --format 'user={{.Config.User}} workdir={{.Config.WorkingDir}} cmd={{json .Config.Cmd}} healthcheck={{if .Config.Healthcheck}}yes{{else}}no{{end}} stopsignal={{.Config.StopSignal}} exposed={{json .Config.ExposedPorts}}')"

      - name: Build frontend images (infrastructure/docker/frontend.prod.Dockerfile)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          common="--build-arg VITE_API_URL=https://api.garnishtable.com --build-arg VITE_MARKETING_URL=https://garnishtable.com"
          declare -A args=(
            [web]="$common --build-arg VITE_SITE_URL=https://order.garnishtable.com --build-arg VITE_ADMIN_URL=https://app.garnishtable.com"
            [admin]="$common --build-arg VITE_STOREFRONT_URL=https://order.garnishtable.com --build-arg VITE_POS_URL=https://pos.garnishtable.com --build-arg VITE_AGENCY_URL=https://agency.garnishtable.com --build-arg VITE_PLATFORM_ADMIN_URL=https://admin.garnishtable.com"
            [marketing]="--build-arg VITE_SITE_URL=https://garnishtable.com --build-arg VITE_STOREFRONT_URL=https://order.garnishtable.com --build-arg VITE_ADMIN_URL=https://app.garnishtable.com"
          )
          for app in web admin marketing; do
            start=$(date +%s)
            if docker build -f infrastructure/docker/frontend.prod.Dockerfile --build-arg APP=$app ${args[$app]} -t gt-$app:85b . > "$RUNNER_TEMP/build-$app.log" 2>&1; then
              pass "Build $app image" "$(( $(date +%s) - start ))s, $(docker image inspect gt-$app:85b --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}')"
            else
              tail -60 "$RUNNER_TEMP/build-$app.log"; fail "Build $app image" "see log"; exit 1
            fi
          done
          # The build guard must refuse a production build that is missing its URLs.
          if docker build -f infrastructure/docker/frontend.prod.Dockerfile --build-arg APP=web -t gt-web:missing . > "$RUNNER_TEMP/build-missing.log" 2>&1; then
            fail "Build guard rejects missing VITE_* args" "build unexpectedly succeeded"
          else
            check "Build guard rejects missing VITE_* args" "$(grep -o 'Missing build arguments[^"]*' "$RUNNER_TEMP/build-missing.log" | head -1)" grep -q "Missing build arguments for APP=web" "$RUNNER_TEMP/build-missing.log"
          fi

      - name: Image hygiene and environment isolation scan
        run: |
          source "$RUNNER_TEMP/lib.sh"
          for img in api web admin marketing; do
            dir="$RUNNER_TEMP/fs-$img"; mkdir -p "$dir"
            cid=$(docker create gt-$img:85b); docker export "$cid" | tar -x -C "$dir" 2>/dev/null; docker rm "$cid" > /dev/null
            # .env files anywhere outside third-party node_modules
            envfiles=$(find "$dir" -name '.env*' -not -path '*/node_modules/*' -not -path '*/proc/*' 2>/dev/null | sed "s#$dir##")
            check "No .env files in $img image" "${envfiles:-none found}" test -z "$envfiles"
            # Canaries planted in the checkout's .env files must appear nowhere in the image
            hits=$(grep -rIl --exclude-dir=proc --exclude-dir=sys 'leakcanary' "$dir" 2>/dev/null | sed "s#$dir##" | head -5)
            check "No local .env value leaked into $img image" "${hits:-0 canary hits}" test -z "$hits"
            # Secret-shaped strings in the application (not third-party) files
            appdir="$dir/repo/apps $dir/repo/packages $dir/usr/share/nginx/html"
            secrets=$(grep -rIlE 'sk_live_[A-Za-z0-9]{10}|sk_test_[A-Za-z0-9]{10}|pdl_(live|sdbx)_apikey|BEGIN (RSA |EC )?PRIVATE KEY|mongodb(\+srv)?://[^"'"'"' ]*@|sk-ant-[A-Za-z0-9]' $appdir 2>/dev/null | sed "s#$dir##" | head -5)
            check "No secret-shaped strings in $img app files" "${secrets:-none}" test -z "$secrets"
          done
          api="$RUNNER_TEMP/fs-api/repo"
          for p in tsx jest ts-jest vite @playwright/test; do
            check "API image excludes dev package $p" "node_modules/$p absent" test ! -e "$api/node_modules/$p"
          done
          check "API image has no TypeScript sources" "apps/api/src absent" test ! -e "$api/apps/api/src"
          check "API image runs compiled dist" "apps/api/dist/index.js present" test -f "$api/apps/api/dist/index.js"
          info "API image lint tooling (known 85B issue 3)" "typescript=$(test -e $api/node_modules/typescript && echo present || echo absent) eslint=$(test -e $api/node_modules/eslint && echo present || echo absent)"
          # Frontend bundles: no localhost API/app URLs, no source maps, the demo slug does not leak
          for app in web admin marketing; do
            html="$RUNNER_TEMP/fs-$app/usr/share/nginx/html"
            maps=$(find "$html" -name '*.map' | wc -l)
            check "No source maps in $app bundle" "$maps .map files" test "$maps" -eq 0
            lh=$(grep -rhoE '.{0,40}(localhost|127\.0\.0\.1).{0,40}' "$html" --include=*.js --include=*.html | grep -vE 'location\.hostname:`localhost`|hostname!==`localhost`|placeholder:`http://localhost:9100`|e\.g\. http://localhost:9100' | head -3)
            check "No localhost URLs baked into $app bundle" "${lh:-only known benign occurrences}" test -z "$lh"
          done
          webjs=$(ls "$RUNNER_TEMP"/fs-web/usr/share/nginx/html/assets/index-*.js | head -1)
          # A clean build contains demo-restaurant exactly once (MenuPage's SEO noindex check,
          # slug===`demo-restaurant`). A leaked VITE_RESTAURANT_SLUG=demo-restaurant would add more.
          n=$(grep -o 'demo-restaurant' "$webjs" | wc -l)
          check "Storefront bundle did not inherit VITE_RESTAURANT_SLUG=demo-restaurant" "$n occurrence(s); clean baseline is 1 ($(grep -oE '.{12}demo-restaurant.{2}' "$webjs" | head -1))" test "$n" -eq 1

      - name: Start throwaway MongoDB (replica set) and Redis 7
        run: |
          source "$RUNNER_TEMP/lib.sh"
          docker network create gt85b
          docker run -d --name mongo --network gt85b mongo:7 --replSet rs0 --bind_ip_all > /dev/null
          docker run -d --name redis --network gt85b redis:7-alpine > /dev/null
          for i in $(seq 1 60); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' > /dev/null 2>&1 && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}).ok' > /dev/null
          for i in $(seq 1 60); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 1; done
          check "MongoDB replica set primary" "mongo $(docker exec mongo mongosh --quiet --eval 'db.version()')" test "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true"
          check "Redis 7 ready" "redis $(docker exec redis redis-server --version | grep -oE 'v=[0-9.]+')" test "$(docker exec redis redis-cli ping)" = "PONG"

      - name: Start API container (production mode, throwaway config)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          A=$(openssl rand -hex 32); B=$(openssl rand -hex 32); echo "::add-mask::$A"; echo "::add-mask::$B"
          cat > "$RUNNER_TEMP/api.env" <<EOF
          NODE_ENV=production
          PORT=4000
          MONGO_URI=mongodb://mongo:27017/gt_85b_ci?replicaSet=rs0
          REDIS_URL=redis://redis:6379/0
          JWT_ACCESS_SECRET=$A
          JWT_REFRESH_SECRET=$B
          CLIENT_ORIGIN=https://order.garnishtable.com
          ADMIN_ORIGIN=https://app.garnishtable.com
          MARKETING_ORIGIN=https://garnishtable.com
          API_PUBLIC_ORIGIN=https://api.garnishtable.com
          PORTAL_ORIGINS=https://agency.garnishtable.com,https://admin.garnishtable.com,https://pos.garnishtable.com
          TRUST_PROXY=uniquelocal
          EMAIL_PROVIDER=smtp
          SMTP_HOST=127.0.0.1
          SMTP_PORT=2525
          EMAIL_FROM=GarnishTable <no-reply@garnishtable.com>
          CONTACT_NOTIFICATION_EMAIL=hello@garnishtable.com
          GEOCODING_PROVIDER=test
          PAYMENT_PROVIDER=mock
          POS_TERMINAL_PROVIDER=none
          BILLING_PROVIDER=mock
          MARKETPLACE_PROVIDER_MODE=mock
          MENU_EXTRACTION_PROVIDER_MODE=mock
          DNS_VERIFIER=node
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/api.env"
          # Production refuses to start with an unsafe configuration (no TRUST_PROXY) — inside the image.
          grep -v '^TRUST_PROXY=' "$RUNNER_TEMP/api.env" > "$RUNNER_TEMP/bad.env"
          out=$(docker run --rm --network gt85b --env-file "$RUNNER_TEMP/bad.env" gt-api:85b 2>&1); code=$?
          check "Image refuses to boot without TRUST_PROXY" "exit $code" test $code -ne 0 -a -n "$(echo "$out" | grep TRUST_PROXY)"
          docker run -d --name api --network gt85b --env-file "$RUNNER_TEMP/api.env" --stop-timeout 20 -p 4000:4000 gt-api:85b > /dev/null
          status=starting
          for i in $(seq 1 90); do status=$(docker inspect -f '{{.State.Health.Status}}' api); [ "$status" = healthy ] && break; [ "$(docker inspect -f '{{.State.Running}}' api)" = false ] && break; sleep 2; done
          check "Docker HEALTHCHECK reports healthy" "status=$status after ~$((i*2))s" test "$status" = healthy
          [ "$status" = healthy ] || { docker logs api | tail -40; exit 1; }
          info "Process in API container" "$(docker top api -o pid,user,args | tail -n +2 | head -3 | tr -s ' ' | tr '\n' ';')"

      - name: API checks
        run: |
          source "$RUNNER_TEMP/lib.sh"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          check "GET /health/live" "$(code http://localhost:4000/health/live)" test "$(code http://localhost:4000/health/live)" = 200
          ready=$(curl -s http://localhost:4000/health)
          check "GET /health readiness (mongo + redis up)" "$ready" sh -c "echo '$ready' | grep -q '\"mongo\":\"up\",\"redis\":\"up\"'"
          check "GET /api/v1/public/plans" "$(code http://localhost:4000/api/v1/public/plans)" test "$(code http://localhost:4000/api/v1/public/plans)" = 200
          check "Swagger /api/docs/ served from compiled image" "$(code http://localhost:4000/api/docs/)" test "$(code http://localhost:4000/api/docs/)" = 200
          check "Dev-only /local-storage route absent" "$(code http://localhost:4000/local-storage/x)" test "$(code http://localhost:4000/local-storage/x)" = 404
          check "Mock payment webhook refused" "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/webhooks/payments/mock)" test "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/webhooks/payments/mock)" = 404
          check "Mock billing webhook refused" "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/webhooks/billing/mock)" test "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/webhooks/billing/mock)" = 404
          check "Mock marketplace webhook refused" "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/webhooks/marketplace/uber_eats)" test "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/webhooks/marketplace/uber_eats)" = 404
          check "Mock checkout completion route absent" "$(code -X POST http://localhost:4000/api/v1/billing/mock-checkout/x/complete)" test "$(code -X POST http://localhost:4000/api/v1/billing/mock-checkout/x/complete)" = 404
          errs=$(docker logs api 2>&1 | grep -c '"level":"error"')
          check "No error-level lines in API startup logs" "$errs error lines" test "$errs" -eq 0
          info "API startup warnings" "$(docker logs api 2>&1 | grep -o '"level":"warn","message":"[^"]\{0,70\}' | sed 's/"level":"warn","message":"//' | tr '\n' ';')"

      - name: Deploy scripts and demo provisioning inside the API container
        run: |
          source "$RUNNER_TEMP/lib.sh"
          for s in ensureIndexes seed; do
            out=$(docker exec api node dist/scripts/$s.js 2>&1); c=$?
            check "node dist/scripts/$s.js" "exit $c" test $c -eq 0
          done
          first=$(docker exec api node dist/scripts/provisionProductionDemo.js 2>&1 | grep -o 'Created: .*')
          check "Demo provisioning creates Wildwood Kitchen" "$first" sh -c "echo '$first' | grep -q '\"restaurant\":true,\"categories\":7,\"menuItems\":28,\"modifierGroups\":11'"
          second=$(docker exec api node dist/scripts/provisionProductionDemo.js 2>&1 | grep -o 'Created: .*')
          check "Demo provisioning re-run creates nothing" "$second" sh -c "echo '$second' | grep -q '\"owner\":false,\"business\":false,\"restaurant\":false,\"categories\":0,\"menuItems\":0,\"modifierGroups\":0'"

      - name: Worker (in-process BullMQ worker) against Redis 7
        run: |
          source "$RUNNER_TEMP/lib.sh"
          check "Worker queue connection ready" "[queue] redis ready in API logs" sh -c "docker logs api 2>&1 | grep -q 'queue\] redis ready'"
          rep=$(docker exec redis redis-cli ZCARD bull:notifications:repeat)
          check "Repeatable job schedules registered" "$rep schedules" test "$rep" -ge 5
          cat > "$RUNNER_TEMP/job.cjs" <<'EOF'
          const { Queue, QueueEvents } = require("bullmq");
          const connection = { host: "redis", port: 6379, maxRetriesPerRequest: null };
          (async () => {
            const q = new Queue("notifications", { connection });
            const ev = new QueueEvents("notifications", { connection });
            await ev.waitUntilReady();
            const wait = (job) => new Promise((resolve) => {
              ev.on("completed", ({ jobId }) => jobId === job.id && resolve("completed"));
              ev.on("failed", ({ jobId, failedReason }) => jobId === job.id && resolve("failed: " + failedReason));
              setTimeout(() => resolve("timeout"), 30000);
            });
            const ok = await q.add("payment.reconciliation_tick", {}, { attempts: 1 });
            console.log("SAFE_JOB " + (await wait(ok)));
            const bad = await q.add("delivery.dispatch_create", { orderId: "000000000000000000000000", restaurantId: "000000000000000000000000" }, { attempts: 1 });
            console.log("BAD_JOB " + (await wait(bad)));
            await ev.close(); await q.close();
          })();
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/job.cjs"
          # Inside apps/api so require("bullmq") resolves from the image's own node_modules.
          docker cp "$RUNNER_TEMP/job.cjs" api:/repo/apps/api/job85b.cjs
          out=$(docker exec api node job85b.cjs 2>&1)
          safe=$(echo "$out" | grep -o 'SAFE_JOB.*'); bad=$(echo "$out" | grep -o 'BAD_JOB.*')
          check "Safe test job completes" "$safe" test "$safe" = "SAFE_JOB completed"
          check "Failing test job fails cleanly" "$bad" sh -c "echo '$bad' | grep -q 'BAD_JOB failed: Order not found'"
          check "API healthy after failed job" "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health)" test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health)" = 200

      - name: Start frontend containers and verify nginx
        run: |
          source "$RUNNER_TEMP/lib.sh"
          for app in web admin marketing; do
            out=$(docker run --rm --network gt85b -e API_UPSTREAM=http://api:4000 gt-$app:85b nginx -t 2>&1); c=$?
            check "nginx -t ($app image, templates rendered)" "$(echo "$out" | grep -oE 'syntax is ok|test is successful|emerg.*' | tr '\n' ' ')" test $c -eq 0
          done
          docker run -d --name web --network gt85b -e API_UPSTREAM=http://api:4000 -p 80:80 gt-web:85b > /dev/null
          docker run -d --name admin --network gt85b -e API_UPSTREAM=http://api:4000 -p 8082:80 gt-admin:85b > /dev/null
          docker run -d --name marketing --network gt85b -e API_UPSTREAM=http://api:4000 -p 8083:80 gt-marketing:85b > /dev/null
          sleep 2
          for app in web admin marketing; do
            check "nginx running in $app container" "$(docker inspect -f '{{.State.Status}}' $app)" test "$(docker inspect -f '{{.State.Running}}' $app)" = true
            check "nginx -t inside running $app container" "exit" docker exec $app nginx -t
          done
          info "Rendered upstream (web)" "$(docker exec web grep -o 'proxy_pass [^;]*' /etc/nginx/conf.d/default.conf | head -1)"

      - name: Frontend routing through nginx (seven-hostname layout by Host header)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          req() { curl -s -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/hdr" -w '%{http_code}' -H "Host: $2" "http://localhost:$1$3"; }
          hdr() { grep -i "^$1:" "$RUNNER_TEMP/hdr" | tr -d '\r' | cut -d' ' -f2-; }
          declare -A port=([garnishtable.com]=8083 [app.garnishtable.com]=8082 [agency.garnishtable.com]=8082 [admin.garnishtable.com]=8082 [pos.garnishtable.com]=8082 [order.garnishtable.com]=80 [orders.wildwood-test.example]=80)
          for host in garnishtable.com app.garnishtable.com agency.garnishtable.com admin.garnishtable.com pos.garnishtable.com order.garnishtable.com orders.wildwood-test.example; do
            c=$(req ${port[$host]} $host /)
            check "$host / serves index.html" "$c $(hdr content-type) cache=$(hdr cache-control)" sh -c "[ $c = 200 ] && grep -qi '<div id=\"root\"' '$RUNNER_TEMP/body'"
          done
          for spec in "80 order.garnishtable.com /r/demo-restaurant" "80 order.garnishtable.com /r/demo-restaurant/experience" "8082 pos.garnishtable.com /pos" "8082 agency.garnishtable.com /agency/billing" "8082 admin.garnishtable.com /platform/restaurants" "8083 garnishtable.com /pricing"; do
            set -- $spec; c=$(req $1 $2 $3)
            check "SPA fallback $2$3" "$c cache=$(hdr cache-control)" sh -c "[ $c = 200 ] && grep -qi '<div id=\"root\"' '$RUNNER_TEMP/body' && [ '$(hdr cache-control)' = 'no-cache' ]"
          done
          for p in 80 8082 8083; do
            req $p x / > /dev/null; asset=$(grep -oE '/assets/[^"]+\.js' "$RUNNER_TEMP/body" | head -1)
            c=$(req $p x "$asset")
            check "Static asset on :$p" "$asset $c cache=$(hdr cache-control)" sh -c "[ $c = 200 ] && echo '$(hdr cache-control)' | grep -q immutable"
            c=$(req $p x /assets/does-not-exist.js); check "Missing asset 404s on :$p" "$c" test "$c" = 404
          done
          c=$(req 80 order.garnishtable.com /api/v1/public/plans); check "Storefront nginx proxies /api to the API container" "$c $(hdr content-type)" test "$c" = 200
          c=$(req 8082 pos.garnishtable.com /api/v1/public/plans); check "Admin nginx proxies /api to the API container" "$c" test "$c" = 200
          c=$(req 80 order.garnishtable.com /sitemap.xml); check "Storefront /sitemap.xml proxied to API" "$c $(hdr content-type)" sh -c "[ $c = 200 ] && grep -q urlset '$RUNNER_TEMP/body'"
          c=$(req 8082 app.garnishtable.com /sitemap.xml); check "Admin /sitemap.xml returns 404" "$c" test "$c" = 404
          c=$(req 8083 garnishtable.com /sitemap.xml); check "Marketing serves its static sitemap with production URLs" "$c $(grep -o '<loc>[^<]*' "$RUNNER_TEMP/body" | head -1)" sh -c "[ $c = 200 ] && grep -q '<loc>https://garnishtable.com/' '$RUNNER_TEMP/body'"
          for spec in "80 order.garnishtable.com https://order.garnishtable.com/sitemap.xml" "8083 garnishtable.com https://garnishtable.com/sitemap.xml"; do
            set -- $spec; req $1 $2 /robots.txt > /dev/null
            check "robots.txt absolute Sitemap on $2" "$(grep -i '^Sitemap' "$RUNNER_TEMP/body")" grep -q "^Sitemap: $3" "$RUNNER_TEMP/body"
          done
          req 8083 garnishtable.com / > /dev/null
          check "Marketing og:image absolute" "$(grep -o 'og:image" content="[^"]*' "$RUNNER_TEMP/body")" grep -q 'og:image" content="https://garnishtable.com/og-image.png' "$RUNNER_TEMP/body"
          head -c 31000000 /dev/zero > "$RUNNER_TEMP/big.bin"; rm -f "$RUNNER_TEMP/body"
          c=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' -H 'Host: app.garnishtable.com' -H 'Content-Type: application/octet-stream' --data-binary @"$RUNNER_TEMP/big.bin" http://localhost:8082/api/v1/menu-import-probe)
          check "nginx accepts a 31 MB /api body (client_max_body_size 100m)" "status $c from the API, not nginx" sh -c "[ -s '$RUNNER_TEMP/body' ] && [ '$c' != 413 ] && ! grep -qi '<center>nginx' '$RUNNER_TEMP/body'"

      - name: Browser check — unknown host and demo storefront (headless Chrome)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          chrome=$(command -v google-chrome || command -v chromium)
          dom() { timeout 60 "$chrome" --headless=new --no-sandbox --disable-gpu --host-resolver-rules="MAP * 127.0.0.1" --virtual-time-budget=20000 --dump-dom "$1" 2>/dev/null; }
          unknown=$(dom http://unknown-restaurant.example/)
          check "Unknown storefront host shows the honest no-restaurant message" "$(echo "$unknown" | grep -o "This link doesn.t specify a restaurant" | head -1)" sh -c "echo \"\$0\" | grep -q 'specify a restaurant' && ! echo \"\$0\" | grep -q 'Wildwood'" "$unknown"
          demo=$(dom http://order.garnishtable.com/r/demo-restaurant)
          check "Demo storefront renders Wildwood Kitchen through nginx + API containers" "$(echo "$demo" | grep -o 'Wildwood Kitchen' | head -1) / $(echo "$demo" | grep -o 'Margherita Pizza' | head -1)" sh -c "echo \"\$0\" | grep -q 'Wildwood Kitchen' && echo \"\$0\" | grep -q 'Margherita Pizza'" "$demo"

      - name: Graceful shutdown of the API container (docker stop → SIGTERM)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          start=$(date +%s%N)
          docker stop api > /dev/null
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          exitc=$(docker inspect -f '{{.State.ExitCode}}' api); oom=$(docker inspect -f '{{.State.OOMKilled}}' api)
          logs=$(docker logs api 2>&1 | tail -20)
          check "SIGTERM received" "shutting down log line" sh -c "echo \"\$0\" | grep -q '\"message\":\"shutting down\",\"signal\":\"SIGTERM\"'" "$logs"
          check "Shutdown sequence completed" "[shutdown] complete" sh -c "echo \"\$0\" | grep -q 'shutdown\] complete'" "$logs"
          check "Clean exit code" "exit=$exitc oom=$oom" test "$exitc" = 0 -a "$oom" = false
          check "Stopped well inside the 20s stop timeout (no SIGKILL)" "${ms}ms" test "$ms" -lt 15000

      - name: Summary
        if: always()
        run: |
          R="$GITHUB_WORKSPACE/../results.txt"
          { echo "## Phase 85B Docker verification"; echo; echo '| Result | Check | Detail |'; echo '|---|---|---|'; sed -E 's/^([A-Z]+) \| ([^|]*) \| (.*)$/| \1 | \2 | \3 |/' "$R"; } >> "$GITHUB_STEP_SUMMARY"
          p=$(grep -c '^PASS' "$R" || true); f=$(grep -c '^FAIL' "$R" || true)
          # Every result, published as a few annotations (a single annotation is truncated around
          # 4 KB). Workflow-command encoding for % and newlines; titles must not contain commas.
          echo "::notice title=TOTAL $p passed and $f failed::$p passed / $f failed"
          split -l 18 "$R" "$RUNNER_TEMP/part-"
          n=0; for part in "$RUNNER_TEMP"/part-*; do n=$((n+1))
            body=$(cut -c1-200 "$part" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=RESULTS part $n::$body"
          done
          [ "$f" -eq 0 ]

      - name: Logs on failure
        if: failure()
        run: |
          for c in api web admin marketing mongo redis; do echo "=== $c"; docker logs --tail 60 $c 2>&1 || true; done
